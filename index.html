<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>포트폴리오</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">

    <!-- 흰 큰 카드 -->
    <div class="sheet">

      <!-- 왼쪽: ABOUT ME -->
      <aside class="about">
        <p class="eyebrow">ABOUT ME</p>

        <div class="photo">
          <img id="photo-img" alt="프로필 사진" hidden>
          <span id="photo-empty" class="photo-empty">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8z"/></svg>
          </span>
        </div>

        <h2 class="name" id="p-name">불러오는 중…</h2>
        <p class="job" id="p-title"></p>
        <p class="badge" id="p-badge" hidden></p>

        <ul class="contact">
          <li>
            <span class="contact-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8z"/></svg>
            </span>
            <div><span class="contact-label">NAME</span><span class="contact-value" id="c-name"></span></div>
          </li>
          <li>
            <span class="contact-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v12H3z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 7l9 6 9-6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            </span>
            <div><span class="contact-label">EMAIL</span><a class="contact-value" id="c-email"></a></div>
          </li>
          <li>
            <span class="contact-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>
            </span>
            <div><span class="contact-label">PHONE</span><a class="contact-value" id="c-phone"></a></div>
          </li>
          <li>
            <span class="contact-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
            </span>
            <div><span class="contact-label">LOCATION</span><span class="contact-value" id="c-location"></span></div>
          </li>
        </ul>
      </aside>

      <!-- 오른쪽: PORTFOLIO -->
      <section class="content">
        <h1 class="section-title">PORTFOLIO</h1>
        <h2 class="headline" id="p-headline"></h2>
        <p class="intro" id="p-intro"></p>

        <div class="facts">
          <div class="fact">
            <div class="fact-head">
              <span class="fact-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 1 9l11 6 9-4.9V17h2V9z"/><path d="M5 13.2V17c0 1.7 3.1 3 7 3s7-1.3 7-3v-3.8l-7 3.8z"/></svg>
              </span>
              <h3>EDUCATION</h3>
            </div>
            <p id="p-education"></p>
          </div>
          <div class="fact">
            <div class="fact-head">
              <span class="fact-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22.7 19 13.6 9.9c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>
              </span>
              <h3>SKILLS &amp; TOOLS</h3>
            </div>
            <p id="p-skills"></p>
          </div>
          <div class="fact">
            <div class="fact-head">
              <span class="fact-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3h4a2 2 0 0 1 2 2v1h4a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4V5a2 2 0 0 1 2-2zm0 3h4V5h-4z"/></svg>
              </span>
              <h3>EXPERIENCE</h3>
            </div>
            <p id="p-experience"></p>
          </div>
        </div>

        <section class="highlights">
          <h3 class="highlights-title">PORTFOLIO HIGHLIGHTS</h3>
          <div class="cards" id="cards">
            <p class="empty">불러오는 중…</p>
          </div>
        </section>

        <blockquote class="quote" id="p-quote" hidden></blockquote>
      </section>
    </div>

    <!-- 방명록 -->
    <section class="sheet guestbook">
      <h2 class="section-title">GUESTBOOK</h2>
      <p class="guestbook-help">편하게 한마디 남겨 주세요.</p>

      <div class="guestbook-form">
        <label class="field field-nick">
          <span>별명</span>
          <input id="gb-nickname" type="text" maxlength="20" placeholder="별명 (20자까지)" autocomplete="nickname">
        </label>
        <label class="field field-msg">
          <span>한마디</span>
          <textarea id="gb-message" maxlength="200" rows="2" placeholder="한마디 (200자까지)"></textarea>
        </label>
        <button type="button" id="gb-submit" class="primary-button">남기기</button>
      </div>
      <p class="form-status" id="gb-status" role="status"></p>

      <ul class="guestbook-list" id="gb-list">
        <li class="empty">불러오는 중…</li>
      </ul>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
